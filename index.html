<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Box - Secure Access</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05050a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            max-width: 420px;
            width: 100%;
            background: #0d1117;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            animation: virusPulse 4s infinite alternate;
        }

        @keyframes virusPulse {
            0% { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }
            50% { border-color: #00ff88; box-shadow: 0 0 25px rgba(0, 255, 136, 0.5); }
            100% { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #ff0055;
            animation: spin 12s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 26px;
            color: #00ff88;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff88;
            margin-bottom: 5px;
        }

        .brand-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Tab Switcher */
        .tab-box {
            display: flex;
            background: #161b22;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #00ff88;
            color: #05050a;
            box-shadow: 0 0 10px #00ff88;
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #161b22;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #05050a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 15px #00ff88;
            transform: scale(1.02);
        }

        .divider {
            margin: 20px 0;
            color: #64748b;
            font-size: 12px;
        }

        /* Google Login Button */
        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #333;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .google-btn:hover {
            background: #f1f1f1;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        /* Error & Message Alert */
        #alert-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ff4d4d;
            display: none;
        }

        /* Dashboard Screen */
        #dashboard {
            display: none;
        }

        .dash-card {
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #334155;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION CARD -->
    <div class="auth-container" id="auth-box">
        <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
        <h1 class="brand-title">Gadget Box</h1>
        <p class="brand-sub">Your Premium Gadget Partner</p>

        <!-- Tabs -->
        <div class="tab-box">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Login Access</button>
        </form>

        <div class="divider">OR</div>

        <!-- Google Login -->
        <button class="google-btn" onclick="handleGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Continue with Google
        </button>

        <!-- Message Box -->
        <div id="alert-msg"></div>
    </div>

    <!-- DASHBOARD -->
    <div class="auth-container" id="dashboard">
        <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
        <h1 class="brand-title">Dashboard</h1>
        <p class="brand-sub" id="user-welcome">Welcome to Gadget Box!</p>
        
        <div class="dash-card">
            <p style="color: #00ff88; font-weight: bold; margin-bottom: 8px;">⚡ Customer Panel:</p>
            <ul style="color: #cbd5e1; margin-left: 20px; font-size: 14px; line-height: 1.8;">
                <li>👤 Profile & Settings</li>
                <li>🎧 Gadget Catalog</li>
                <li>📦 My Orders History</li>
                <li>💬 Live WhatsApp Support</li>
            </ul>
        </div>

        <button class="submit-btn" style="background: #ff0055; color: #fff;" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        // Default Local Database Logic for matching
        let currentMode = 'login';
        const usersDB = JSON.parse(localStorage.getItem('gadgetBoxUsers')) || {};

        function switchTab(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('submit-btn');
            hideAlert();

            if(mode === 'login') {
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
                submitBtn.innerText = 'Login Access';
            } else {
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
                submitBtn.innerText = 'Create Account';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (password.length < 6) {
                showAlert("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে!", "#ff4d4d");
                return;
            }

            if (currentMode === 'signup') {
                // Sign Up Process
                if (usersDB[email]) {
                    showAlert("এই ইমেইল দিয়ে ইতোমধ্যে সাইন-আপ করা হয়েছে! অনুগ্রহ করে লগইন করুন।", "#ff4d4d");
                } else {
                    usersDB[email] = password;
                    localStorage.setItem('gadgetBoxUsers', JSON.stringify(usersDB));
                    showAlert("সাইন-আপ সফল হয়েছে! এখন লগইন মোডে যাচ্ছেন...", "#00ff88");
                    setTimeout(() => {
                        switchTab('login');
                    }, 1500);
                }
            } else {
                // Login Process & Password Matching
                if (!usersDB[email]) {
                    showAlert("এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি! আগে সাইন-আপ করুন।", "#ff4d4d");
                } else if (usersDB[email] !== password) {
                    showAlert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিয়ে আবার চেষ্টা করুন।", "#ff4d4d");
                } else {
                    showDashboard(email);
                }
            }
        }

        function handleGoogleLogin() {
            showDashboard("Google Verified User");
        }

        function showAlert(message, color) {
            const alertMsg = document.getElementById('alert-msg');
            alertMsg.innerText = message;
            alertMsg.style.borderColor = color;
            alertMsg.style.color = color;
            alertMsg.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert-msg').style.display = 'none';
        }

        function showDashboard(user) {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('user-welcome').innerText = `Welcome, ${user}!`;
        }

        function handleLogout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('auth-box').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            hideAlert();
        }
    </script>
</body>
</html>
