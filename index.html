<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Box - Portal Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Background for Stars, Moon & Magic Balls */
        #magic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Jhaya888 Premium Form Container */
        .auth-container {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px 22px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: spinSlow 15s linear infinite;
        }

        @keyframes spinSlow {
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 26px;
            color: #ffd700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 2px;
        }

        .brand-sub {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        /* Tab Switcher */
        .tab-box {
            display: flex;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        /* Input Form */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        /* Message Box */
        #alert-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff4d4d;
            display: none;
            font-weight: 600;
        }

        /* Dashboard View */
        #dashboard {
            display: none;
        }

        .dash-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
        }

        .timer-box {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin-top: 15px;
        }

            background: rgba(15, 23, 42, 0.9);
            padding: 10px 5px
