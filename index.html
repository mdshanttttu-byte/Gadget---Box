<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Box - Portal Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Background for Stars, Moon & Magic Balls */
        #magic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Jhaya888 Premium Form Container (No Red Border) */
        .auth-container {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px 22px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: spinSlow 15s linear infinite;
        }

        @keyframes spinSlow {
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 26px;
            color: #ffd700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 2px;
        }

        .brand-sub {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        /* Betting Site Style Tab Switcher */
        .tab-box {
            display: flex;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        /* Input Form */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        /* Message Box */
        #alert-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff4d4d;
            display: none;
            font-weight: 600;
        }

        /* Dashboard View */
        #dashboard {
            display: none;
        }

        .dash-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 18px;
            border-radius: 12px;
            margin: 18px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Dynamic Magic Background -->
    <canvas id="magic-canvas"></canvas>

    <!-- AUTHENTICATION CARD -->
    <div class="auth-container" id="auth-box">
        <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
        <h1 class="brand-title">Gadget Box</h1>
        <p class="brand-sub">Your Premium Gadget Partner</p>

        <!-- Tabs -->
        <div class="tab-box">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">LOGIN</button>
            <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">SIGN UP</button>
        </div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group">
                <label>Email Address / Username</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Login Access</button>
        </form>

        <!-- Notification Box -->
        <div id="alert-msg"></div>
    </div>

    <!-- DASHBOARD PANEL -->
    <div class="auth-container" id="dashboard">
        <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
        <h1 class="brand-title">Dashboard</h1>
        <p class="brand-sub" id="user-welcome">Welcome Back!</p>
        
        <div class="dash-card">
            <p style="color: #ffd700; font-weight: bold; margin-bottom: 8px;">⚡ Quick Options:</p>
            <ul style="color: #cbd5e1; margin-left: 20px; font-size: 13px; line-height: 1.8;">
                <li>👤 My Profile</li>
                <li>🎧 Gadget Catalog</li>
                <li>📦 Order History</li>
                <li>💬 WhatsApp Support</li>
            </ul>
        </div>

        <button class="submit-btn" style="background: linear-gradient(135deg, #ff4d4d, #dc2626); color: #fff;" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        // --- 1. LOGIN & SIGNUP VALIDATION LOGIC ---
        let currentMode = 'login';
        
        function getUsersDB() {
            return JSON.parse(localStorage.getItem('gadgetBoxUsers')) || {};
        }

        function switchTab(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('submit-btn');
            hideAlert();

            if(mode === 'login') {
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
                submitBtn.innerText = 'Login Access';
            } else {
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
                submitBtn.innerText = 'Register Account';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            let usersDB = getUsersDB();

            if (password.length < 6) {
                showAlert("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে!", "#ff4d4d");
                return;
            }

            if (currentMode === 'signup') {
                if (usersDB[email]) {
                    showAlert("এই ইমেইল দিয়ে ইতোমধ্যে অ্যাকাউন্ট রয়েছে! লগইন করুন।", "#ff4d4d");
                } else {
                    usersDB[email] = password;
                    localStorage.setItem('gadgetBoxUsers', JSON.stringify(usersDB));
                    showAlert("রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন...", "#00ff88");
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('auth-form').reset();
                    }, 1500);
                }
            } else {
                if (!usersDB[email]) {
                    showAlert("অ্যাকাউন্ট পাওয়া যায়নি! আগে সাইন-আপ করুন।", "#ff4d4d");
                } else if (usersDB[email] !== password) {
                    showAlert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।", "#ff4d4d");
                } else {
                    showAlert("লগইন সফল হয়েছে! ড্যাশবোর্ডে প্রবেশ করছেন...", "#00ff88");
                    setTimeout(() => {
                        showDashboard(email);
                    }, 800);
                }
            }
        }

        function showAlert(message, color) {
            const alertMsg = document.getElementById('alert-msg');
            alertMsg.innerText = message;
            alertMsg.style.borderColor = color;
            alertMsg.style.color = color;
            alertMsg.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert-msg').style.display = 'none';
        }

        function showDashboard(user) {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('user-welcome').innerText = `Welcome, ${user}!`;
        }

        function handleLogout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('auth-box').style.display = 'block';
            document.getElementById('auth-form').reset();
            hideAlert();
        }

        // --- 2. MAGIC CANVAS ANIMATION (STARS, MOON & TOUCH SPARKLES) ---
        const canvas = document.getElementById('magic-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let stars = [];
        let particles = [];

        // Generate Background Floating Stars & Moon
        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function createMagicBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 50 + 40}, 100%, 60%)`,
                    life: 1
                });
            }
        }

        // Touch & Click Event Listener for Magic Balls
        window.addEventListener('pointerdown', (e) => {
            createMagicBurst(e.clientX, e.clientY);
        });

        // Draw Crescent Moon
        function drawMoon() {
            ctx.save();
            ctx.fillStyle = "#fff8d6";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ffd700";
            ctx.beginPath();
            ctx.arc(canvas.width - 80, 80, 30, 0, Math.PI * 2);
            ctx.fill();

            // Cutout for crescent shape
            ctx.fillStyle = "#060913";
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(canvas.width - 68, 70, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 215, 0, ${Math.abs(star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Moon
            drawMoon();

            // Draw Touch Sparkle Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
                </html>
