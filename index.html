<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Box - Portal Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Background for Stars, Moon & Magic Balls */
        #magic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Jhaya888 Premium Form Container */
        .auth-container {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px 22px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: spinSlow 15s linear infinite;
        }

        @keyframes spinSlow {
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 26px;
            color: #ffd700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 2px;
        }

        .brand-sub {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        /* Tab Switcher */
        .tab-box {
            display: flex;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        /* Input Form */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        /* Message Box */
        #alert-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff4d4d;
            display: none;
            font-weight: 600;
        }

        /* Dashboard View */
        #dashboard {
            display: none;
        }

        .dash-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
        }

        .timer-box {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin-top: 15px;
        }

        .timer-unit {
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 5px;
            border-radius: 8px;
            flex: 1;
            border: 1px solid #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .timer-num {
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            display: block;
        }

        .timer-label {
            font-size: 10px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- Dynamic Magic Background -->
    <canvas id="magic-canvas"></canvas>

    <!-- AUTHENTICATION CARD -->
    <div class="auth-container" id="auth-box">
        <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
        <h1 class="brand-title">Gadget Box</h1>
        <p class="brand-sub">Your Premium Gadget Partner</p>

        <!-- Tabs -->
        <div class="tab-box">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">LOGIN</button>
            <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">SIGN UP</button>
        </div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group">
                <label>Email Address / Username</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Login Access</button>
        </form>

        <!-- Notification Box -->
        <div id="alert-msg"></div>
    </div>

    <!-- DASHBOARD PANEL (COMING SOON) -->
    <div class="auth-container" id="dashboard">
        <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
        <h1 class="brand-title">Gadget Box</h1>
        <p class="brand-sub" id="user-welcome">System Upgrade in Progress</p>
        
        <div class="dash-card">
            <h2 style="color: #ffd700; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px;">COMING SOON</h2>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 15px;">We are upgrading our portal for a better experience!</p>
            
            <!-- Fixed Real Countdown Timer -->
            <div class="timer-box" id="countdown-box">
                <div class="timer-unit">
                    <span class="timer-num" id="days">00</span>
                    <span class="timer-label">Days</span>
                </div>
                <div class="timer-unit">
                    <span class="timer-num" id="hours">00</span>
                    <span class="timer-label">Hours</span>
                </div>
                <div class="timer-unit">
                    <span class="timer-num" id="minutes">00</span>
                    <span class="timer-label">Mins</span>
                </div>
                <div class="timer-unit">
                    <span class="timer-num" id="seconds" style="color: #ff0055;">00</span>
                    <span class="timer-label">Secs</span>
                </div>
            </div>
        </div>

        <button class="submit-btn" style="background: linear-gradient(135deg, #ff4d4d, #dc2626); color: #fff;" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        // --- 1. LOGIN & SIGNUP VALIDATION LOGIC ---
        let currentMode = 'login';
        
        function getUsersDB() {
            return JSON.parse(localStorage.getItem('gadgetBoxUsers')) || {};
        }

        function switchTab(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('submit-btn');
            hideAlert();

            if(mode === 'login') {
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
                submitBtn.innerText = 'Login Access';
            } else {
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
                submitBtn.innerText = 'Register Account';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            let usersDB = getUsersDB();

            if (password.length < 6) {
                showAlert("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে!", "#ff4d4d");
                return;
            }

            if (currentMode === 'signup') {
                if (usersDB[email]) {
                    showAlert("এই ইমেইল দিয়ে ইতোমধ্যে অ্যাকাউন্ট রয়েছে! লগইন করুন।", "#ff4d4d");
                } else {
                    usersDB[email] = password;
                    localStorage.setItem('gadgetBoxUsers', JSON.stringify(usersDB));
                    showAlert("রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন...", "#00ff88");
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('auth-form').reset();
                    }, 1500);
                }
            } else {
                if (!usersDB[email]) {
                    showAlert("অ্যাকাউন্ট পাওয়া যায়নি! আগে সাইন-আপ করুন।", "#ff4d4d");
                } else if (usersDB[email] !== password) {
                    showAlert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।", "#ff4d4d");
                } else {
                    showAlert("লগইন সফল হয়েছে! ড্যাশবোর্ডে প্রবেশ করছেন...", "#00ff88");
                    setTimeout(() => {
                        showDashboard(email);
                    }, 800);
                }
            }
        }

        function showAlert(message, color) {
            const alertMsg = document.getElementById('alert-msg');
            alertMsg.innerText = message;
            alertMsg.style.borderColor = color;
            alertMsg.style.color = color;
            alertMsg.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert-msg').style.display = 'none';
        }

        function showDashboard(user) {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('user-welcome').innerText = `Welcome, ${user}!`;
            
            // ড্যাশবোর্ডে প্রবেশের সময় কিউট হাসির সাউন্ড বা ওয়েলকাম এফেক্ট
            playBabyWelcomeSound();
            
            startCountdown();
        }

        function playBabyWelcomeSound() {
            try {
                const babyAudio = new Audio('https://www.soundjay.com/human/baby-laugh-1.mp3');
                babyAudio.play().catch(error => {
                    console.log("Audio autoplay restricted:", error);
                });
            } catch (e) {
                console.log("Audio error");
            }
        }

        function handleLogout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('auth-box').style.display = 'block';
            document.getElementById('auth-form').reset();
            hideAlert();
        }

        // --- 2. FIXED REAL COUNTDOWN TIMER SCRIPT (২২ নভেম্বর, ২০২৬) ---
        const targetDate = new Date("November 22, 2026 00:00:00").getTime();

        function startCountdown() {
            function updateTimer() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    document.getElementById("countdown-box").innerHTML = "<h3 style='color:#00ff88; font-size:18px;'>SYSTEM IS NOW LIVE!</h3>";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days < 10 ? '0' + days : days;
                document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
            }

            setInterval(updateTimer, 1000);
            updateTimer();
        }

        // --- 3. MAGIC CANVAS ANIMATION (STARS, MOON & TOUCH SPARKLES) ---
        const canvas = document.getElementById('magic-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let stars = [];
        let particles = [];

        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function createMagicBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 50 + 40}, 100%, 60%)`,
                    life: 1
                });
            }
        }

        window.addEventListener('pointerdown', (e) => {
            createMagicBurst(e.clientX, e.clientY);
        });

        function drawMoon() {
            ctx.save();
            ctx.fillStyle = "#fff8d6";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ffd700";
            ctx.beginPath();
            ctx.arc(canvas.width - 80, 80, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#060913";
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(canvas.width - 68, 70, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 215, 0, ${Math.abs(star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            drawMoon();

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
