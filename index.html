<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Box - Your Premium Gadget Partner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05050a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Virus Box Container */
        .container {
            max-width: 500px;
            width: 100%;
            background: #0d1117;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(255, 0, 85, 0.2);
            animation: virusPulse 4s infinite alternate;
        }

        /* Container Virus Breathing Glow */
        @keyframes virusPulse {
            0% {
                border-color: #ff0055;
                box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            }
            50% {
                border-color: #00ff88;
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            }
            100% {
                border-color: #f59e0b;
                box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            }
        }

        .header {
            margin-bottom: 25px;
        }

        /* Virus Spinning Logo */
        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ff0055;
            animation: virusSpin 8s linear infinite, glitchJitter 2s infinite;
        }

        /* Fast Spin Animation */
        @keyframes virusSpin {
            0% {
                transform: rotate(0deg);
                box-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            }
            50% {
                box-shadow: 0 0 25px #00ff88, 0 0 50px #00ff88;
            }
            100% {
                transform: rotate(360deg);
                box-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            }
        }

        /* Glitch Jitter/Shaking Effect */
        @keyframes glitchJitter {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-2px, 2px) rotate(-3deg); }
            20% { transform: translate(2px, -2px) rotate(3deg); }
            30% { transform: translate(-1px, -1px) rotate(0deg); }
            40% { transform: translate(1px, 2px) rotate(1deg); }
            50% { transform: translate(-2px, 0) rotate(-1deg); }
        }

        /* Glitch Text Animation */
        .header h1 {
            font-size: 30px;
            color: #00ff88;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff88, 2px 2px #ff0055;
            animation: textGlitch 1.5s infinite;
        }

        @keyframes textGlitch {
            0%, 100% { text-shadow: 0 0 10px #00ff88, 2px 2px #ff0055; }
            50% { text-shadow: -2px -2px #ff0055, 2px 2px #00ff88; }
        }

        .header p {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-facebook {
            background-color: #1877f2;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(24, 119, 242, 0.4);
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.4);
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #00ff88;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & Animated Virus Logo -->
        <div class="header">
            <img src="1790500817674.jpg" alt="Gadget Box Logo" class="logo-img">
            <h1>Gadget Box</h1>
            <p>Your Premium Gadget Partner</p>
        </div>

        <!-- Action Buttons -->
        <div class="btn-container">
            <a href="https://www.facebook.com/profile.php?id=61595117870237" target="_blank" class="btn btn-facebook">
                Visit Facebook Page
            </a>
            <a href="#" class="btn btn-whatsapp">
                Order via WhatsApp
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2026 Gadget Box. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
